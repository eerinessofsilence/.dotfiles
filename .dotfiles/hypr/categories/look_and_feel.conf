source = $HOME/.cache/wal/colors-hyprland.conf

general {
    gaps_in = 2 
    gaps_out = 6 

    border_size = 1 

    col.active_border = $color5 
    col.inactive_border = $background 
    resize_on_border = false 

    allow_tearing = false

    layout = dwindle
}

decoration {
    active_opacity = 1.0
    inactive_opacity = 1.0
}

dwindle {
    pseudotile = true 
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0 
    disable_hyprland_logo = true 
}

