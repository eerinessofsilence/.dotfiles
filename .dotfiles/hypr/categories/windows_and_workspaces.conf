# Windows and Workspaces

# Ignore maximize requests from apps. You'll probably like this.
windowrule = suppressevent maximize, class:.*

# Fix some dragging issues with XWayland
windowrule = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0

# Rules
windowrule = float,,class:^(firefox)$,title:^(Picture-in-Picture)$
windowrule = pin,class:^(firefox)$,title:^(Picture-in-Picture)$
windowrule = opacity 1 1,class:^(Code)$
windowrule = opacity 1 1,class:^(kitty)$
windowrule = opacity 1 1,class:^(obsidian)$
windowrule = opacity 1 1,class:^(org.gnome.Nautilus)$
windowrule = opacity 1 1,class:^(org.telegram.desktop)$
windowrule = opacity 1 1,class:^(discord)$
windowrule = opacity 1 1, class:^(Zathura)$



# Workspaces
workspace = 1, monitor:DP-1 
workspace = 2, monitor:DP-1
workspace = 3, monitor:DP-1
workspace = 4, monitor:HDMI-A-1
workspace = 5, monitor:HDMI-A-1
workspace = 6, monitor:HDMI-A-1




# XWayland video bridge
windowrule = opacity 0.0 override, class:^(xwaylandvideobridge)$
windowrule = noanim, class:^(xwaylandvideobridge)$
windowrule = noinitialfocus, class:^(xwaylandvideobridge)$
windowrule = maxsize 1 1, class:^(xwaylandvideobridge)$
windowrule = noblur, class:^(xwaylandvideobridge)$
windowrule = nofocus, class:^(xwaylandvideobridge)$
