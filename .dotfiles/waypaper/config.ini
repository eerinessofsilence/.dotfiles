[Settings]
language = en
folder = ~/Pictures/wallpapers/pc
monitors = All
wallpaper = ~/Pictures/wallpapers/pc/pic.png
show_path_in_tooltip = True
backend = hyprpaper
fill = fill
sort = daterev
color = #ffffff
subfolders = True
all_subfolders = False
show_hidden = False
show_gifs_only = False
post_command = wal -i $wallpaper | bash -c $HOME/Documents/scripts/reload_waybar.sh
number_of_columns = 3
swww_transition_type = any
swww_transition_step = 90
swww_transition_angle = 0
swww_transition_duration = 2
swww_transition_fps = 60
mpvpaper_sound = False
mpvpaper_options = 
use_xdg_state = False

